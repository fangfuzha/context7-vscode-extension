name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run compile
      - name: Package extension
        run: npx @vscode/vsce package --out context7-mcp-${{ github.ref_name }}.vsix
      - name: Attach package to release
        run: gh release create ${{ github.ref_name }} context7-mcp-${{ github.ref_name }}.vsix --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
